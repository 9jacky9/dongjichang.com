<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fff7ed"/>
  
  <!-- Grid pattern for Tech/Cyber feel -->
  <g stroke="#e8734a" stroke-opacity="0.1" stroke-width="1">
    <path d="M0 100 h1200 M0 200 h1200 M0 300 h1200 M0 400 h1200 M0 500 h1200 M0 600 h1200"/>
    <path d="M100 0 v630 M200 0 v630 M300 0 v630 M400 0 v630 M500 0 v630 M600 0 v630 M700 0 v630 M800 0 v630 M900 0 v630 M1000 0 v630 M1100 0 v630"/>
  </g>

  <!-- Highlight accent -->
  <circle cx="600" cy="315" r="400" fill="#e8734a" opacity="0.15" filter="blur(100px)"/>

  <!-- Logo Icon -->
  <svg x="380" y="240" width="120" height="120" viewBox="0 0 40 40">
    <rect width="40" height="40" rx="10" fill="#e8734a"/>
    <path d="M9 21L31 9L21 31L18 22L9 21Z" fill="#fff"/>
    <circle cx="30" cy="30" r="7" fill="#fff" stroke="#e8734a" stroke-width="1.5"/>
    <path d="M27 30l2 2 4-4" stroke="#e8734a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <!-- Brand Name -->
  <text x="530" y="300" font-family="sans-serif" font-size="80" font-weight="900" fill="#09090b" dominant-baseline="central">懂机场</text>
  
  <!-- Slogan -->
  <text x="600" y="440" font-family="sans-serif" font-size="32" font-weight="400" fill="#52525b" text-anchor="middle">懂行朋友帮你把机场讲清楚，让你少踩坑</text>

  <!-- URL -->
  <text x="600" y="580" font-family="sans-serif" font-size="24" font-weight="600" fill="#e8734a" text-anchor="middle" letter-spacing="4">DONGJICHANG.COM</text>
</svg>
