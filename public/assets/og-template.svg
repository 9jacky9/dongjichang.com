<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  
  <!-- Grid pattern for Tech/Cyber feel -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 100 h1200 M0 200 h1200 M0 300 h1200 M0 400 h1200 M0 500 h1200 M0 600 h1200"/>
    <path d="M100 0 v630 M200 0 v630 M300 0 v630 M400 0 v630 M500 0 v630 M600 0 v630 M700 0 v630 M800 0 v630 M900 0 v630 M1000 0 v630 M1100 0 v630"/>
  </g>

  <!-- Highlight accent -->
  <circle cx="600" cy="315" r="400" fill="#6366f1" opacity="0.15" filter="blur(100px)"/>

  <!-- Logo Icon -->
  <rect x="400" y="240" width="120" height="120" rx="24" fill="#6366f1"/>
  <text x="460" y="300" font-family="sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">懂</text>

  <!-- Brand Name -->
  <text x="560" y="300" font-family="sans-serif" font-size="80" font-weight="900" fill="#ffffff" dominant-baseline="central">机场</text>
  
  <!-- Slogan -->
  <text x="600" y="440" font-family="sans-serif" font-size="32" font-weight="400" fill="#a1a1aa" text-anchor="middle">懂行朋友帮你把机场讲清楚，让你少踩坑</text>

  <!-- URL -->
  <text x="600" y="580" font-family="sans-serif" font-size="24" font-weight="600" fill="#6366f1" text-anchor="middle" letter-spacing="4">DONGJICHANG.COM</text>
</svg>
