<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 1440 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="url(#gridGlow)" stroke-width="1.5" stroke-dasharray="4 2" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1440" height="800" fill="url(#bg)" />
  
  <g transform="perspective(500) rotateX(60) scale(2, 1) translate(-360, 0)">
    <rect width="1440" height="1200" fill="url(#cyberGrid)" />
  </g>

  <!-- Glowing core/rays -->
  <ellipse cx="720" cy="150" rx="300" ry="80" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <ellipse cx="720" cy="150" rx="100" ry="30" fill="#06b6d4" opacity="0.3" filter="url(#glow)" />

  <!-- Digital particles/lines -->
  <line x1="200" y1="100" x2="350" y2="100" stroke="#6366f1" stroke-width="2" opacity="0.5" />
  <line x1="1100" y1="250" x2="1300" y2="250" stroke="#06b6d4" stroke-width="2" opacity="0.4" />
  <line x1="400" y1="400" x2="450" y2="400" stroke="#6366f1" stroke-width="3" opacity="0.6" />
</svg>
